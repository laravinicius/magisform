name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:server
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t magisform:ci .
      - run: docker build -f Dockerfile.manager -t magisform-manager:ci .
